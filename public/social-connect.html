<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conectar redes sociais · Graao</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/graao-dark.css">
  <link rel="stylesheet" href="/graao.css">
  <link rel="stylesheet" href="/button-system.css">
  <link rel="stylesheet" href="/social.css">
  <link rel="stylesheet" href="/lucide-animated.css"><link rel="stylesheet" href="/liquid-glass.css">
  <script type="module" src="/social-connect.js"></script>
</head>
<body>
  <main class="sp-invite-page">
    <p class="dim">Graao / Planejador social</p>
    <h1>Conecte suas redes sociais</h1>
    <p>Use este convite para autorizar as contas que farão parte do planejador.</p>
    <p class="dim" id="expiry"></p>
    <p id="notice" role="status">Validando convite…</p>
    <section id="networks" class="sp-net-grid" aria-label="Redes disponíveis"></section>
    <form id="bluesky" hidden>
      <h2>Conectar Bluesky</h2>
      <label>Usuário<input name="identifier" placeholder="voce.bsky.social" required></label>
      <label>Senha de app<input name="password" type="password" autocomplete="off" required></label>
      <button class="primary">Conectar conta</button>
    </form>
    <form id="accounts" hidden>
      <h2>Escolha as contas que quer conectar</h2>
      <div class="sp-picks"></div>
      <button class="primary">Conectar selecionadas</button>
    </form>
  </main>
</body>
</html>
