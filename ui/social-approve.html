<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Aprovar posts · Graao</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/graao-dark.css">
  <link rel="stylesheet" href="/graao.css">
  <link rel="stylesheet" href="/button-system.css">
  <link rel="stylesheet" href="/social.css"><link rel="stylesheet" href="/liquid-glass.css">
  <script type="module" src="/social-approve.js"></script>
</head>
<body>
  <main class="sp-approve-page">
    <header class="sp-approve-head">
      <p class="dim" id="brand">Graao / Aprovação de posts</p>
      <h1>Posts aguardando sua aprovação</h1>
      <p>Confira cada publicação antes de ela ir ao ar. Aprove ou peça ajustes com um comentário para a equipe.</p>
      <p class="dim" id="expiry"></p>
      <label class="sp-approve-name">Seu nome<input id="reviewer" autocomplete="name" maxlength="80" placeholder="Como a equipe deve te identificar"></label>
    </header>
    <p id="notice" role="status">Abrindo posts…</p>
    <section id="posts" class="sp-approve-list" aria-label="Posts para aprovar"></section>
    <section id="reviewed" class="sp-approve-done" hidden>
      <h2>Decisões recentes</h2>
      <ul></ul>
    </section>
  </main>
</body>
</html>
