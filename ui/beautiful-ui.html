<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beautiful UI · graao</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/graao.css">
  <link rel="stylesheet" href="/beautiful-ui.css">
  <link rel="stylesheet" href="/button-system.css"><link rel="stylesheet" href="/liquid-glass.css">
  <style>
    body { margin: 0; background: var(--g-surface-2, #f4f6f8); color: var(--g-ink, #0f131a); }
    .gallery { max-width: 1180px; margin: 0 auto; padding: 32px 16px 80px; }
    .gallery-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .gallery-head h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .gallery-head p { margin: 6px 0 0; max-width: 620px; color: var(--g-dim, #5d6673); font-size: 14px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; }
    .demo { display: flex; min-width: 0; flex-direction: column; gap: 14px; padding: 18px; border-radius: 14px; background: var(--g-surface, #fff); box-shadow: 0 0 0 1px var(--g-line, #e2e5ea); }
    .demo.is-wide { grid-column: 1 / -1; }
    .demo h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--g-dim, #5d6673); }
    .demo-stage { display: flex; min-width: 0; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .demo-stage.is-start { align-items: stretch; }
    .demo-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
    .sidebar-frame { display: flex; height: 460px; overflow: hidden; border-radius: 12px; background: var(--g-surface-2, #f4f6f8); box-shadow: 0 0 0 1px var(--g-line, #e2e5ea); }
    .sidebar-frame main { flex: 1; display: grid; place-items: center; color: var(--g-faint, #8b929c); font-size: 13px; border-left: 1px solid var(--g-line, #e2e5ea); background: var(--g-surface, #fff); }
    .demo[data-demo="Prompt Bar"] .demo-stage { min-height: 280px; justify-content: flex-end; }
    .log { min-height: 18px; margin: 0; font-size: 12px; color: var(--g-faint, #8b929c); text-align: center; }
  </style>
</head>
<body>
  <div class="gallery">
    <header class="gallery-head">
      <div>
        <h1>Beautiful UI no graao</h1>
        <p>Os 27 componentes de beautifului.dev (licença MIT) portados para JS puro, com os tokens do app. Os dados abaixo são de exemplo.</p>
      </div>
      <button type="button" class="secondary" id="theme">Alternar tema</button>
    </header>
    <div class="gallery-grid" id="grid"></div>
  </div>
  <script type="module">
    import * as A from '/beautiful-ui.js';
    import * as B from '/beautiful-ui-more.js';

    const html = document.documentElement;
    try { if (localStorage.getItem('graao.theme') !== 'light') html.dataset.theme = 'dark'; } catch {}
    document.getElementById('theme').addEventListener('click', () => {
      if (html.dataset.theme === 'dark') delete html.dataset.theme; else html.dataset.theme = 'dark';
    });

    const grid = document.getElementById('grid');
    const wait = ms => new Promise(r => setTimeout(r, ms));
    function demo(title, build, { wide = false, start = false } = {}) {
      const box = document.createElement('section');
      box.className = `demo${wide ? ' is-wide' : ''}`;
      box.dataset.demo = title;
      const h = document.createElement('h2');
      h.textContent = title;
      const stage = document.createElement('div');
      stage.className = `demo-stage${start ? ' is-start' : ''}`;
      const log = document.createElement('p');
      log.className = 'log';
      box.append(h, stage, log);
      grid.append(box);
      const say = text => { log.textContent = text; };
      try { build(stage, say); } catch (error) { say(`Erro: ${error.message}`); console.error(error); }
    }
    const append = (stage, ...items) => items.forEach(i => stage.append(i.el || i));

    demo('Loading State', stage => {
      const row = document.createElement('div');
      row.className = 'demo-row';
      row.append(A.loadingState({ label: 'Pensando' }).el, A.loadingState({ label: 'Buscando contatos', variant: 'Dots' }).el, A.loadingState({ label: 'Gerando relatório', variant: 'Orbit' }).el);
      stage.append(row);
    });

    demo('Thinking', stage => {
      const t = A.thinkingState({ active: 'Pensando', working: true, open: true, rows: [
        { primary: 'Lendo as subcontas' }, { primary: 'Somando assinaturas ativas', secondary: '32 planos' }
      ] });
      append(stage, t);
      setTimeout(() => { t.setRows([{ primary: 'Lendo as subcontas' }, { primary: 'Somando assinaturas ativas', secondary: '32 planos' }, { primary: 'Escrevendo a resposta' }]); }, 1200);
      setTimeout(() => { t.setDone('Pensou por 3s'); t.setWorking(false); }, 2600);
    });

    demo('Streaming Text', (stage, say) => {
      append(stage, B.streamingText({
        text: 'A receita recorrente da agência fechou o mês em R$ 48.200, alta de 6%. [1] As três maiores subcontas respondem por 41% do total. [2]',
        sources: [
          { name: 'Painel da agência', domain: 'graao.com', href: '#' },
          { name: 'Relatório de MRR', domain: 'relatorios.graao', href: '#' }
        ],
        followUps: ['Quais subcontas cresceram mais?', 'Compare com o trimestre passado'],
        onFollowUp: q => say(`Continuar: ${q}`),
        onAction: a => say(`Ação: ${a}`)
      }));
    }, { start: true });

    demo('Approval Card', (stage, say) => {
      append(stage, A.approvalCard({
        questions: [
          { q: 'Quantos posts por semana devo agendar?', type: 'radio', options: ['Três', 'Cinco', 'Só um destaque'] },
          { q: 'Em quais redes publico?', type: 'check', options: ['Instagram', 'Facebook', 'LinkedIn'] }
        ],
        onSubmit: r => say(`Respostas: ${r.map(x => x.answers.join(', ')).join(' · ')}`)
      }));
    });

    demo('Tool Chips', stage => {
      append(stage, A.toolChips({ steps: [
        { icon: 'think', label: 'Pensando', chip: 'Planejando a consulta…', detail: [{ text: 'Somar assinaturas ativas por subconta.' }] },
        { icon: 'search', label: 'Consultou', chip: 'subcontas.mrr', mono: true, detailMono: true, detail: [{ text: '+ 32 subcontas ativas', tone: 'add' }] },
        { icon: 'write', label: 'Escreveu', chip: 'relatorio-mensal.md', mono: true, detailMono: true, detail: [{ text: '+ ## Receita recorrente', tone: 'add' }] }
      ] }));
    });

    demo('Task Rows', stage => {
      const t = A.taskRows({ rows: [
        { key: 'a', label: 'Conferiu os contatos', amount: '12 contatos', status: 'done', details: [{ label: 'E-mails válidos', meta: '12/12' }] },
        { key: 'b', label: 'Montando a lista de follow-up', amount: '7 itens', status: 'running', step: 2, details: [{ label: 'Lendo o funil', meta: '3 etapas' }] },
        { key: 'c', label: 'Rascunhar e-mails', amount: '2 mensagens', status: 'pending', step: 3, details: [{ label: 'Follow-up Clínica Ipê', meta: 'rascunho' }] }
      ] });
      append(stage, t);
      setTimeout(() => t.update('c', { status: 'failed' }), 2400);
      setTimeout(() => t.update('c', { status: 'done' }), 3800);
    });

    demo('Chat', (stage, say) => {
      append(stage, B.chatComposer({
        tabs: ['Contatos', 'Funil'],
        actions: [{ label: 'Nova conversa', path: '<path d="M12 5v14M5 12h14"/>' }, { label: 'Histórico', path: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' }],
        onSend: async (text, reply) => {
          say(`Enviado: ${text}`);
          await wait(600);
          reply({ label: 'Histórico', sub: 'CRM', time: '2s', body: 'Encontrei 14 conversas com esse contato nos últimos 30 dias.' });
          await wait(1300);
          reply({ label: 'Resumo', sub: 'Tendência', time: '1s', body: 'O contato respondeu mais rápido às terças de manhã.' });
        }
      }));
    });

    demo('Prompt Bar', (stage, say) => {
      append(stage, B.promptBar({
        sources: [
          { key: 'files', name: 'Fotos e arquivos', desc: 'Enviar do computador', glyph: 'clip', attach: true },
          { key: 'crm', name: 'Contatos', desc: 'CRM da subconta', glyph: 'user' },
          { key: 'funnel', name: 'Funil', desc: 'Oportunidades e etapas', glyph: 'chart' },
          { key: 'web', name: 'Busca na web', desc: 'Notícias e dados atuais', glyph: 'globe' }
        ],
        commands: [
          { key: 'resumo', name: '/resumo', desc: 'Resumir a conversa' },
          { key: 'email', name: '/email', desc: 'Escrever um e-mail' },
          { key: 'relatorio', name: '/relatorio', desc: 'Montar um relatório' }
        ],
        models: [{ key: 'rapido', name: 'Rápido', tag: 'Básico' }, { key: 'pro', name: 'Pro', tag: 'Mais capaz', celebrate: true }],
        onAttach: async () => ['proposta.pdf'],
        onSend: ({ text, attachments, model }) => say(`Enviado (${model}): ${text || '(só anexos)'} ${attachments.length ? `+ ${attachments.join(', ')}` : ''}`)
      }));
    }, { start: true });

    demo('Recommendation Card', (stage, say) => {
      const body = document.createElement('span');
      body.append('Reenviar a proposta para ', A.entityChip('Clínica Ipê'), ' com prazo de ', A.valuePill('7 dias', 'green'));
      append(stage, A.recommendationCard({
        title: 'Quer que eu envie este follow-up?',
        options: [
          { key: 'a', body, short: 'Reenviar para Clínica Ipê · 7 dias', signal: 3, tone: 'var(--bui-green)', label: 'Alta confiança', cta: 'Aceitar', ctaVariant: 'accent' },
          { key: 'b', body: 'Ligar antes de reenviar a proposta.', short: 'Ligar antes', signal: 2, tone: 'var(--bui-orange)', label: 'Revisar', cta: 'Configurar', ctaVariant: 'primary' },
          { key: 'c', body: 'Mandar a proposta completa de novo.', short: 'Proposta completa', signal: 0, tone: 'var(--bui-ink-3)', label: 'Sem sinal', cta: 'Aceitar mesmo assim', ctaVariant: 'primary' }
        ],
        onAccept: o => say(`Aceito: ${o.short}`)
      }));
    });

    demo('Context Cards', stage => {
      append(stage, A.contextCards({ header: 'Trechos que o agente recebe', chunks: [
        { title: 'Política de trocas', chars: '122 caracteres', body: 'Aceitamos trocas em até 7 dias após a entrega, com nota fiscal.', source: 'Base Atendimento', badge: 'FAQ', tone: 'var(--bui-accent)' },
        { title: 'Horário', chars: '64 caracteres', body: 'Atendimento de segunda a sexta, das 9h às 18h.', source: 'Base Atendimento', badge: 'TXT', tone: 'var(--bui-ink-3)' }
      ] }));
    });

    demo('Diff Table', (stage, say) => {
      append(stage, B.diffTable({
        title: 'Limpeza proposta na lista',
        columns: [{ key: 'name', label: 'Contato', width: '1.1fr' }, { key: 'tag', label: 'Etiqueta', width: '0.9fr' }, { key: 'email', label: 'E-mail', width: '1.2fr' }],
        rows: [
          { key: 'r1', values: { name: 'Ana Souza', tag: 'Lead frio', email: 'ana@exemplo.com' }, change: 'remove' },
          { key: 'r2', values: { name: 'Bruno Lima', tag: 'Duplicado', email: 'bruno@exemplo.com' }, change: 'remove' },
          { key: 'r3', values: { name: 'Carla Dias', tag: 'Cliente', email: 'carla@exemplo.com' } },
          { key: 'r4', values: { name: 'Diego Reis', tag: 'Novo lead', email: 'diego@exemplo.com' }, change: 'add' }
        ],
        onApply: list => say(`Aplicado: ${list.map(r => r.values.name).join(', ')}`)
      }));
    });

    demo('Records Table', (stage, say) => {
      const statuses = { forte: { label: 'Muito forte', color: 'var(--bui-green)', rank: 3 }, fraca: { label: 'Fraca', color: 'var(--bui-orange)', rank: 2 }, muitofraca: { label: 'Muito fraca', color: 'var(--bui-red)', rank: 1 }, nenhuma: { label: 'Sem contato', color: 'var(--bui-ink-3)', rank: 0 } };
      const names = ['Clínica Ipê', 'Studio Aurora', 'Padaria Sol', 'Escola Raiz', 'Ótica Lume', 'Pet Vila', 'Café Norte', 'Barbearia Ás', 'Doce Lar', 'Academia Fôlego'];
      const tagPool = ['Saúde', 'Varejo', 'B2B', 'B2C', 'Local', 'Educação', 'Serviços', 'Food'];
      const keys = Object.keys(statuses);
      const rows = names.map((name, i) => ({ id: `r${i}`, name, tags: [tagPool[i % 8], tagPool[(i + 3) % 8], tagPool[(i + 5) % 8]].slice(0, 2 + (i % 2)), last: `${(i * 3) % 20 + 1} dias atrás`, strength: keys[i % 4], site: i % 3 ? `${name.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '')}.exemplo.com` : '' }));
      append(stage, B.recordsTable({
        columns: [
          { key: 'name', label: 'Empresa', type: 'title', width: 250 },
          { key: 'tags', label: 'Categorias', type: 'tags', width: 230 },
          { key: 'last', label: 'Último contato', type: 'date', width: 160 },
          { key: 'strength', label: 'Relacionamento', type: 'status', width: 170, statuses },
          { key: 'site', label: 'Site', type: 'link', width: 200 }
        ],
        rows,
        footerLabel: 'empresas',
        ai: { label: 'Concorrentes', compute: async r => { await wait(180); return ['Rede Alfa', 'Grupo Beta', 'Casa Gama'][r.name.length % 3]; } },
        onSelect: ids => say(`${ids.length} selecionadas`),
        onOpen: r => say(`Abrir: ${r.name}`)
      }));
    }, { wide: true, start: true });

    demo('Filter Table', stage => {
      append(stage, B.filterTable({
        columns: [{ key: 'task', label: 'Tarefa', width: '1.3fr' }, { key: 'date', label: 'Data', width: '0.6fr' }, { key: 'status', label: 'Situação', width: '0.95fr' }, { key: 'owner', label: 'Responsável', width: '0.9fr' }],
        statuses: [{ key: 'todo', label: 'A fazer', color: 'oklch(0.757 0.153 66.401)' }, { key: 'progress', label: 'Em andamento', color: 'oklch(0.671 0.118 219.351)' }, { key: 'done', label: 'Concluída', color: 'oklch(0.652 0.131 162.865)' }],
        rows: [
          { task: 'Revisar proposta', date: '03 dez', status: 'todo', owner: 'Marina' },
          { task: 'Agendar posts', date: '22 set', status: 'progress', owner: 'Lucas' },
          { task: 'Atualizar site', date: '02 jan', status: 'todo', owner: 'Rafa' },
          { task: 'Enviar relatório', date: '08 nov', status: 'progress', owner: 'Bia' },
          { task: 'Configurar domínio', date: '14 abr', status: 'done', owner: 'Caio' }
        ]
      }));
    }, { start: true });

    demo('Sidebar Nav', (stage, say) => {
      const frame = document.createElement('div');
      frame.className = 'sidebar-frame';
      const main = document.createElement('main');
      main.textContent = 'Área de conteúdo';
      const sb = B.sidebarNav({
        workspace: { name: 'Minha agência', mark: 'M' },
        menu: [{ label: 'Nova subconta', icon: 'plus' }, { label: 'Configurações', icon: 'settings' }, { label: 'Convidar equipe', icon: 'userAdd' }, 'divider', { label: 'Sair', icon: 'logout' }],
        nav: [{ key: 'home', label: 'Início', icon: 'home' }, { key: 'invite', label: 'Convidar', icon: 'userAdd', count: '3/10' }],
        recents: ['Relatório de MRR', 'Follow-up Clínica Ipê', 'Posts da semana', 'Lista de leads frios', 'Campanha de Natal', 'Revisão do funil'].map((label, i) => ({ id: `c${i}`, label })),
        footer: { label: 'Fazer upgrade', onClick: () => say('Upgrade') },
        onNew: () => say('Nova conversa'),
        onNavigate: k => say(`Navegar: ${k}`),
        onPick: r => say(`Abrir: ${r.label}`)
      });
      frame.append(sb.el, main);
      stage.append(frame);
    }, { start: true });

    demo('Search', (stage, say) => {
      append(stage, B.searchList({
        placeholder: 'Buscar ações…',
        items: ['Criar subconta', 'Importar contatos', 'Agendar post', 'Gerar relatório', 'Enviar proposta', 'Configurar domínio', 'Convidar equipe'],
        onSelect: item => say(`Escolhido: ${item}`)
      }));
    });

    demo('Flowchart', (stage, say) => {
      append(stage, B.flowchart({
        steps: [
          { id: 't', row: 0, x: 0.5, w: 300, kind: { label: 'Gatilho', hue: '#9a5cff' }, hue: '#9a5cff', title: 'Novo lead criado', caption: 'Dispara quando um lead entra pelo formulário' },
          { id: 'c', row: 1, x: 0.5, w: 380, kind: { label: 'Se / Senão', hue: '#f09a2f' }, conditions: [
            { lead: 'Se', source: 'lead', prop: { value: 'origem', items: ['origem', 'etiqueta', 'cidade'] }, op: 'é', value: { value: 'Instagram', items: [{ name: 'Instagram', tag: 'Social' }, { name: 'Google', tag: 'Busca' }, { name: 'Indicação', tag: 'Boca a boca' }] } },
            { lead: 'e', source: 'lead', prop: { value: 'etiqueta', items: ['origem', 'etiqueta', 'cidade'] }, op: 'é', value: { value: 'Quente', items: ['Quente', 'Morno', 'Frio'] } }
          ] }
        ],
        edges: [{ from: 't', to: 'c' }],
        onSelect: s => say(s ? `Selecionado: ${s.title}` : 'Nada selecionado'),
        onChange: (s, c) => say(`Condição: ${c.prop.value} é ${c.value.value}`)
      }));
    }, { start: true });

    demo('Insight Cards', (stage, say) => {
      const fmtPct = v => `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
      const brl = v => `R$ ${Math.round(v).toLocaleString('pt-BR')}`;
      const prose1 = document.createElement('span');
      prose1.append('A subconta com pior resultado em ', B.mention('Agência', '#f68f3c'), ' é a Ótica Lume, com queda de ', B.monoValue('-6%'), '.');
      append(stage, B.insightCards({
        pages: [
          { key: 'cmp', prose: prose1, pill: 'Devo rever o plano dela?', card: { type: 'compare', caption: 'Tendência', format: fmtPct, series: [
            { name: 'Ótica Lume', values: [-2.9, -3.4, -3.05, -3.86, -3.52, -4.1, -3.82, -4.41], sub: '-R$ 2.377', tone: 'red', color: '#f68f3c' },
            { name: 'Clínica Ipê', values: [0.22, 0.58, 0.42, 0.91, 0.76, 1.08, 0.96, 1.15], sub: '+R$ 617', tone: 'green', color: '#3d9aff' }
          ] } },
          { key: 'anom', prose: 'Gasto com anúncios fora do normal no dia 13: bem acima da média.', pill: 'Como cortar esse gasto?', card: { type: 'metric', title: 'Gasto alto com anúncios', alert: true, total: 'R$ 2.112 gastos', delta: '+R$ 1.834', note: 'vs 3 meses', metrics: [
            { label: 'Gasto', caption: 'Limite R$ 2.112', values: [274, 289, 264, 307, 331, 1210, 1718, 2112], format: brl },
            { label: 'Cliques', caption: 'Limite 82 cliques', values: [18, 19, 17, 21, 22, 58, 81, 96], format: v => `${Math.round(v)} cliques` }
          ] } },
          { key: 'alloc', prose: 'Instagram concentra 72,5% do orçamento de anúncios.', pill: 'E se eu dividir melhor?', card: { type: 'allocation', title: 'Divisão do orçamento', note: 'Fatia do orçamento atual. Escolher um segmento muda o grupo inspecionado.', segments: [
            { name: 'IG', label: 'Instagram', pct: 72.5, amount: 'R$ 51.785', color: 'var(--bui-orange)' },
            { name: 'GOO', label: 'Google', pct: 22.8, amount: 'R$ 16.278', color: 'var(--bui-line-strong)' },
            { name: 'FB', label: 'Facebook', pct: 4.7, amount: 'R$ 3.357', color: 'var(--bui-line)' }
          ] } }
        ],
        onPill: p => say(`Pergunta: ${p.pill}`)
      }));
    });

    demo('Code Block', stage => {
      append(stage, B.codeBlock({ filename: 'webhook.js', lines: [
        'export async function onLead(lead) {',
        '  const contato = await crm.criar({ nome: lead.nome });',
        '  if (!contato.email) return null;',
        '  await funil.mover(contato, "Novo lead");',
        '  return contato.id;',
        '}'
      ] }));
      append(stage, B.codeBlock({ filename: 'webhook.js', diff: [
        { old: 1, cur: 1, type: 'ctx', pieces: [{ text: 'export async function onLead(lead) {' }] },
        { old: 2, cur: null, type: 'del', pieces: [{ text: '  await funil.mover(contato, ' }, { text: '"Lead"', change: 'del' }, { text: ');' }] },
        { old: null, cur: 2, type: 'add', pieces: [{ text: '  await funil.mover(contato, ' }, { text: '"Novo lead"', change: 'add' }, { text: ');' }] },
        { old: null, cur: 3, type: 'add', pieces: [{ text: '  if (!contato.email) return null;' }] },
        { old: 3, cur: 4, type: 'ctx', pieces: [{ text: '}' }] }
      ] }));
    });

    demo('Fine-tune Card', (stage, say) => {
      append(stage, B.fineTuneCard({
        title: 'Cartão do post',
        fields: [{ key: 'w', label: 'L', value: 324, min: 40, max: 999 }, { key: 'h', label: 'A', value: 96, min: 24, max: 999 }, { key: 'r', label: 'Raio', value: 28, min: 0, max: 64 }, { key: 'o', label: 'Opac.', value: 100, min: 0, max: 100, suffix: '%' }],
        options: ['Sazonal', 'Clássico', 'Limitado'],
        onChange: s => say(`Layout ${s.segment} · L ${s.values.w} · tipo ${s.type || '—'}`)
      }));
    });

    demo('Selection Actions', (stage, say) => {
      append(stage, B.selectionActions({
        lead: 'O fim de semana é o melhor momento para postar. ',
        original: 'Publique logo cedo no sábado para o post ganhar alcance antes do almoço.',
        onRun: async instruction => {
          await wait(700);
          return instruction === 'Encurtar' ? 'Publique sábado cedo, antes do almoço.' : 'Publique no sábado bem cedo, para o post ganhar alcance antes do horário do almoço.';
        },
        onAction: a => say(`Ação: ${a}`),
        onKeep: t => say(`Mantido: ${t}`)
      }));
    });

    demo('Agent Screen', (stage, say) => {
      const screen = B.agentScreen({
        workspace: { name: 'Minha agência', mark: 'S' },
        nav: [{ key: 'home', label: 'Visão geral', icon: 'home' }, { key: 'contacts', label: 'Contatos', icon: 'userAdd', count: '1.284' }],
        recents: [{ id: 'r1', label: 'Follow-up Clínica Ipê' }, { id: 'r2', label: 'Relatório de MRR' }, { id: 'r3', label: 'Posts da semana' }],
        active: 'home',
        tools: [
          { icon: 'search', label: 'Consultou', chip: 'oportunidades.abertas', mono: true },
          { icon: 'read', label: 'Leu', chip: 'histórico de contato', mono: true },
          { icon: 'write', label: 'Escreveu', chip: 'follow-up.md', mono: true }
        ],
        chunks: [
          { title: 'Histórico da Clínica Ipê', chars: '2.184 caracteres', body: 'A última resposta chegou há 18 dias. O contato pediu uma proposta com prazo de implantação.', source: 'Base de contatos', badge: 'CRM', tone: 'var(--bui-accent)' }
        ],
        prompt: { sources: [{ key: 'crm', name: 'Contatos', desc: 'CRM da agência', glyph: 'user' }], commands: [{ key: 'follow', name: '/follow-up', desc: 'Montar uma sequência' }], models: [{ key: 'pro', name: 'Pro', tag: 'Graao' }] },
        onSend: value => say(typeof value === 'string' ? `Pergunta: ${value}` : `Enviado: ${value.text || 'anexo'}`)
      });
      stage.append(screen.el);
    }, { wide: true, start: true });

    demo('Átomos', stage => {
      const row = document.createElement('div');
      row.className = 'demo-row';
      ['primary', 'secondary', 'ghost', 'accent', 'success', 'quiet'].forEach(v => row.append(A.button(v, { variant: v })));
      const pills = document.createElement('p');
      pills.style.margin = 0;
      pills.append('Contato ', A.entityChip('Marina Alves', { color: '#7c5cff' }), ' com prazo ', A.valuePill('7 dias', 'green'), A.valuePill('atrasado', 'red'), A.valuePill('revisar', 'orange'), A.valuePill('novo', 'accent'), ' e ', A.shimmer('carregando'));
      stage.append(row, pills);
    });
  </script>
</body>
</html>
