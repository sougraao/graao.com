<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Importar para o graao</title>
  <style>
    :root { --ink: #1d1b22; --muted: #6b6775; --line: #e7e4ec; --brand: #ff4f9a; --brand-ink: #fff; --bad: #c62f4a; --good: #127a52; --bg: #fff; --soft: #f7f5fa; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f2eff7; --muted: #a9a4b4; --line: #34303d; --bg: #17151c; --soft: #211e28; --bad: #ff7a90; --good: #5fd3a0; } }
    * { box-sizing: border-box; }
    body { margin: 0; width: 340px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    header img { width: 28px; height: 28px; border-radius: 8px; }
    header strong { font-size: 15px; }
    main { padding: 14px 16px 16px; display: grid; gap: 12px; }
    p { margin: 0; color: var(--muted); }
    ol { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); color: var(--ink); }
    #code { font: 600 20px/1 ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
    button { font: 600 14px/1 inherit; font-family: inherit; padding: 11px 14px; border: 0; border-radius: 999px; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    details summary { cursor: pointer; color: var(--muted); }
    details label { margin-top: 8px; font-weight: 500; }
    .bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s; }
    .status { min-height: 20px; }
    .status.bad { color: var(--bad); }
    .status.good { color: var(--good); font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><img src="icon-128.png" alt=""><strong>Importar para o graao</strong></header>
  <main>
    <section id="nolocation" hidden>
      <p>Abra no GHL a subconta onde o snapshot está carregado (o endereço tem <code>/location/…</code>) e clique na extensão de novo.</p>
    </section>
    <form id="form" hidden>
      <ol>
        <li>No graao, em Setups de conta, clique em <strong>Importar do GHL</strong>.</li>
        <li>Copie o código que aparece lá e cole aqui.</li>
        <li>Deixe esta janela aberta até terminar.</li>
      </ol>
      <label>Código de importação<input id="code" autocomplete="off" spellcheck="false" maxlength="11" placeholder="XXX-XXX-XXX" required></label>
      <details>
        <summary>Avançado</summary>
        <label>Endereço do graao<input id="origin" type="url" placeholder="https://graao.com"></label>
      </details>
      <button id="go" type="submit">Importar esta subconta</button>
      <div class="bar" id="bar" hidden><span></span></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="popup.js"></script>
</body>
</html>
